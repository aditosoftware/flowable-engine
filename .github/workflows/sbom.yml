name: Flowable SBOM Build

on:
  release:
    types:
      - created

jobs:
  test_jdk:
    name: Linux (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [1.8, 11, 13]
    steps:
    - uses: actions/checkout@v2-beta
      with:
        fetch-depth: 10
    - uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
    - name: Install
      # Need to do install first in order for the OSGi tests to work
      run: ./mvnw install -V -B --no-transfer-progress -DskipTests=true -Dmaven.javadoc.skip=true -B -V
    - name: Test
      run: ./mvnw verify -Pdistro,errorLogging,includeDockerTests -B --no-transfer-progress -V -Dmaven.test.redirectTestOutputToFile=false

  sbom:
    name: Generate merged SBOM
    if: github.event_name == 'release' || (github.ref_name == 'main' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    needs: test_jdk
    steps:
      - uses: actions/checkout@v6

      #- name: Set up Node.js
      #  uses: actions/setup-node@v6
      #  with:
      #    node-version: 22.x

      #- name: Install dependencies (root)
      #  run: npm ci --ignore-scripts

      #- name: Install deps (webview-ui)
      #  working-directory: webview-ui
      #  run: npm ci --ignore-scripts

      #- name: Install cyclonedx-npm
      #  run: npm install --global --ignore-scripts @cyclonedx/cyclonedx-npm

      #- name: Generate SBOM (root)
      #  run: cyclonedx-npm --omit=dev --output-file sbom/sbom-root.json

      #- name: Generate SBOM (webview-ui)
      #  run: cyclonedx-npm --omit=dev --output-file sbom/sbom-webview-ui.json webview-ui/package.json

      - name: Prepare directory for SBOM JARs
        run: npm run prepareSbomJarCreation

      - name: Create SBOM for JARs
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ./out/sbom/
          format: cyclonedx-json
          upload-artifact: false
          output-file: sbom/sbom-jars.json
          config: ./.syft.yaml

      - name: Merge + validate (CycloneDX CLI via Docker)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            cyclonedx/cyclonedx-cli \
            cp sbom/sbom-root.json sbom/combined-sbom.json

      - name: Convert combined SBOM to CycloneDX 1.6
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            cyclonedx/cyclonedx-cli \
            convert --input-file sbom/combined-sbom.json --output-file sbom/combined-sbom-1.6.json --output-version v1_6 --output-format json

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@48feab3080ff9e8f51f4d21861d9fc914eb744f5
        with:
          serverHostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          apiKey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          projectName: ${{ github.event.repository.name }}
          projectVersion: ${{ github.ref_name }}
          projectTags: 'flowable-modeler,${{ github.event.repository.name }}'
          bomFilename: "sbom/combined-sbom-1.6.json"
          autoCreate: true